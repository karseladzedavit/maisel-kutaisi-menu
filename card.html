<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<title>Maisel Kutaisi - QR table cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@500;600;700&family=Noto+Serif+Georgian:wght@700&display=swap" rel="stylesheet">
<style>
  @page { size: A4; margin: 0; }
  *{box-sizing:border-box}
  body{
    margin:0;background:#E9E6DF;
    font-family:"Noto Sans Georgian","Segoe UI",system-ui,sans-serif;
  }
  .sheet{
    width:210mm;height:297mm;margin:0 auto;background:#fff;
    display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
  }
  .card{
    width:105mm;height:148.5mm;
    background:radial-gradient(120% 80% at 50% 0%, #2A6EBB 0%, #16386B 48%, #0F2A52 100%);
    color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:10mm 8mm;
    outline:1px dashed rgba(0,0,0,.18);outline-offset:-0.2mm;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  .seal{width:50mm;margin-bottom:5mm}
  .seal img{width:100%;height:auto;display:block}
  .name{
    font-family:"Noto Serif Georgian",Georgia,serif;font-weight:700;
    font-size:8.2mm;line-height:1;letter-spacing:.01em;margin:0 0 1.6mm;
  }
  .sub{
    font-size:2.6mm;letter-spacing:.28em;text-transform:uppercase;
    color:#BFD4EE;margin:0 0 6mm;
  }
  .qrbox{
    background:#fff;border-radius:3mm;padding:4mm;
    box-shadow:0 1mm 4mm rgba(0,0,0,.22);
  }
  .qrbox img{width:44mm;height:44mm;display:block}
  .cta{margin-top:6mm;font-weight:700;font-size:4.2mm;line-height:1.5}
  .cta span{display:block;font-weight:500;font-size:3.4mm;color:#BFD4EE;letter-spacing:.04em}
  .rule{width:26mm;height:.4mm;background:linear-gradient(90deg,transparent,#C9CFD6,transparent);margin:5mm 0 0}
  @media screen{ .sheet{box-shadow:0 4px 30px rgba(0,0,0,.18);margin:20px auto} }
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>
<script>
var CARD =
  '<div class="card">'
+   '<div class="seal"><img src="menu/logo.png" alt="Maisel\'s Weisse aus Bayreuth"></div>'
+   '<h1 class="name">Maisel Kutaisi</h1>'
+   '<p class="sub">Bavarian Beer &middot; Georgian Kitchen</p>'
+   '<div class="qrbox"><img src="qr.svg" alt="Menu QR code"></div>'
+   '<div class="cta">დაასკანერე მენიუსთვის<span>Scan for the menu</span></div>'
+   '<div class="rule"></div>'
+ '</div>';
document.getElementById("sheet").innerHTML = CARD + CARD + CARD + CARD;
</script>
</body>
</html>
